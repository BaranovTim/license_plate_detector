{% extends "base.html" %}{% block title %}Audit log{% endblock %}
{% block body %}
<h1>Audit log</h1>
<table>
  <tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>
  {% for r in rows %}<tr><td>{{ r.at|replace('T', ' ') }}</td><td>{{ r.username or '' }}</td><td>{{ r.action }}</td><td class="muted">{{ r.details or '' }}</td></tr>{% endfor %}
</table>
{% endblock %}
